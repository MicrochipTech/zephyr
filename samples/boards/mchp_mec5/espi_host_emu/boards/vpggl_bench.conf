# Bench configuration for exercising the Target's VPGGL (glue logic).
# Use with:
#   -DEXTRA_CONF_FILE=boards/vpggl_bench.conf
#   -DEXTRA_DTC_OVERLAY_FILE=boards/vpggl_bench.overlay
#
# This Host drives the Target's VPGGL inputs (VCC_PWRGD, PWRGD_S0IX,
# SLP_S0#) from the hvpggl shell. The Host_nREADY/TARGET_nREADY handshake
# wires are not fitted (those Host pins are reused for VPGGL), and the main
# sequence must not drive VCC_PWRGD itself.
CONFIG_SAMPLE_HOST_HANDSHAKE_GPIOS=n
CONFIG_SAMPLE_HOST_DRIVES_VCC_PWRGD=n

# Bring the link up, de-assert PLTRST#, then hand over to the shell
# (selects CONFIG_SAMPLE_STOP_AFTER_PLTRST).
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SAMPLE_VPGGL_SHELL=y
# Logs go through the shell backend; avoid printing every line twice.
CONFIG_LOG_BACKEND_UART=n
