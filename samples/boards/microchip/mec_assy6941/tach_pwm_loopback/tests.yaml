sample:
  name: Microchip XEC tachometer PWM loopback
  description: Check the XEC TACH RPM conversion against a PWM generated pulse train
common:
  tags:
    - board
    - sensors
    - pwm
  platform_allow:
    - mec_assy6941/mec1653b_nsz
    - mec_assy6941/mec1743_qlj
    - mec_assy6941/mec1743_qsz
    - mec_assy6941/mec1753_qlj
    - mec_assy6941/mec1753_qsz
  integration_platforms:
    - mec_assy6941/mec1753_qsz
  # Needs PWM0 fly-wired to the four TACH inputs, so twister only builds these
  # unless it is run with --device-testing --fixture tach_xec_pwm_loopback.
  harness: console
  harness_config:
    fixture: tach_xec_pwm_loopback
    type: one_line
    regex:
      - "TACH XEC PWM loopback: PASS"
tests:
  # No extra overlay: every instance takes the pulses-per-round default of 2.
  sample.boards.mec_assy6941.tach_pwm_loopback: {}
  sample.boards.mec_assy6941.tach_pwm_loopback.ppr_a:
    extra_args: EXTRA_DTC_OVERLAY_FILE=ppr-a.overlay
  sample.boards.mec_assy6941.tach_pwm_loopback.ppr_b:
    extra_args: EXTRA_DTC_OVERLAY_FILE=ppr-b.overlay
  sample.boards.mec_assy6941.tach_pwm_loopback.ppr_c:
    extra_args: EXTRA_DTC_OVERLAY_FILE=ppr-c.overlay
  sample.boards.mec_assy6941.tach_pwm_loopback.ppr_d:
    extra_args: EXTRA_DTC_OVERLAY_FILE=ppr-d.overlay
  # A bench measurement, not a self test: it needs an external generator on the
  # TACH inputs and its result is the offset it prints, so there is nothing for
  # a harness to match on and twister only build checks it.
  sample.boards.mec_assy6941.tach_pwm_loopback.raw_count:
    build_only: true
    extra_args:
      - EXTRA_CONF_FILE=raw-count.conf
      - EXTRA_DTC_OVERLAY_FILE=raw-count.overlay
