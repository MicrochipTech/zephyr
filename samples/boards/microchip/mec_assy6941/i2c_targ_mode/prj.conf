CONFIG_LOG=y
# Deferred, not immediate. Immediate mode writes the line out of the context that
# logged it, and at 115200 baud a line of this length holds that context for about
# 8 ms. One of them is logged from a k_timer callback, so that is 8 ms of interrupt
# context, against an address match window of about two bus clocks. The target
# transactions being measured would be missed by the measurement.
CONFIG_LOG_MODE_DEFERRED=y
# A failing loop logs several lines at once and the default 1024 bytes drops some.
# Dropped lines are reported as a count, not silently, but the per-address tallies
# these logs are read for need all of them.
CONFIG_LOG_BUFFER_SIZE=8192

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_DMA=y
CONFIG_DMA_MCHP_XEC_MAX_BLOCKS_PER_CHAN=4

CONFIG_I2C=y
CONFIG_I2C_TARGET=y
CONFIG_I2C_TARGET_BUFFER_MODE=y
CONFIG_I2C_MCHP_XEC_NL_STATE_CAPTURE=y
CONFIG_I2C_MCHP_XEC_NL_STATE_CAPTURE_SIZE=1024
CONFIG_I2C_MCHP_XEC_NL_STATE_CAPTURE_INIT_ON_XFR=n

CONFIG_GPIO=y
CONFIG_COUNTER=y

CONFIG_APP_FAULT_SYNC_START=y
