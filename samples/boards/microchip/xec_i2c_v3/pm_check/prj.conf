# Enable config log
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8096

CONFIG_I2C=y
CONFIG_I2C_CALLBACK=y
CONFIG_I2C_TARGET=y
CONFIG_I2C_TARGET_BUFFER_MODE=y

# PCA9555 GPIO expander @0x26 is a real on-bus child of i2c-port0. Because the
# two-tier model makes the *port* the I2C bus (init prio 51, one above the
# controller at 50), the expander must init AFTER the port. The PCA driver's
# default init prio is I2C_INIT_PRIORITY (50), which would run before the port
# bus is ready -> device_is_ready(bus) fails -> -ENODEV. Raise it above 51.
CONFIG_GPIO=y
CONFIG_GPIO_PCA_SERIES_INIT_PRIORITY=60

# Required for sample app to get PINCTRL info from I2C ports
CONFIG_PINCTRL_DYNAMIC=y

# use pseudo-random data for non-cryptographic test patterns
CONFIG_TEST_RANDOM_GENERATOR=y

# power management
# CONFIG_PM only
#   Kernel uses power-states min-residency times in deciding PM state transition
#   Drivers have no knowledge of PM state
#   Kernel invokes SoC PM layer 
#     SoC PM must handle any special device requirements to enter/exit PM states
#
# CONFIG_PM_DEVICE only
#   Application trigger PM state transition
#   Kernel invokes PM callback on all drivers implementing the callback
#     Driver performs device specific PM action
#   Kernel invokes SoC PM layer
#     SoC PM layers does need to touch devices with PM_DEVICE enabled drivers
#   Wake Event
#   SoC PM layer returns to kernel
#   Kernel invokes PM callback on all drivers implementing the callack
#
# CONFIG_PM and CONFIG_DEVICE
# Same as CONFIG_PM_DEVICE with addition of kernel triggering PM state transition
# based on min-residency times
#
CONFIG_PM=n
CONFIG_PM_DEVICE=y

# make stepping code easier
CONFIG_DEBUG=y
