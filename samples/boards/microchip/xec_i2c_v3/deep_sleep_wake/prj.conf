# Console logging. Immediate mode makes log calls synchronous so the
# "entering deep sleep" line is fully flushed before the WFI, and there is
# no deferred log-processing thread that would keep the system from idling
# into the forced suspend-to-RAM state.
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8096
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_I2C=y
CONFIG_I2C_TARGET=y
# Buffer-mode target callbacks. Required by the NL driver's target_register
# (it rejects a target without buf_write_received); the byte-mode driver
# supports buffer mode too, so one main.c serves both boards.
CONFIG_I2C_TARGET_BUFFER_MODE=y

# Power management. CONFIG_PM enables the suspend-to-RAM (deep sleep) state
# defined on the board dts; CONFIG_PM_DEVICE gates the I2C driver's per-device
# pm_action hooks, which arm the START-detect wake on a wakeup-source target.
CONFIG_PM=y
CONFIG_PM_DEVICE=y
