CONFIG_GPIO=y

# The EC Interrupt Aggregator (ECIA/GIRQ) is not present on the current MTR
# proFPGA bitstream, so run the XEC GPIO driver in polled mode: skip all ECIA/NVIC
# setup at init and make gpio_pin_interrupt_configure() return -ENOTSUP.
CONFIG_GPIO_XEC_INTERRUPT=n
