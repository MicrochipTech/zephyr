# Enable config log
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8096

# use pseudo-random data for non-cryptographic test patterns
CONFIG_TEST_RANDOM_GENERATOR=y

# Use kernel triggered PM and driver PM_DEVICE
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# make stepping code easier
#CONFIG_DEBUG=y
