CONFIG_EVENTS=y
CONFIG_I3C=y
CONFIG_I3C_USE_IBI=y
CONFIG_I3C_CONTROLLER_ROLE_ONLY=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_OVERRIDE_LEVEL=4
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BUFFER_SIZE=4096
#CONFIG_DEBUG_OPTIMIZATIONS=y


CONFIG_I3C_TEST_CASE=0
CONFIG_I3C_TEST_CRC_CHECK=y

CONFIG_I3C_HOST_TARGET_PID_HI=0x0558
CONFIG_I3C_HOST_TARGET_PID_LO=0x00000000

# Immediate-mode debug logging runs on the caller stack (incl. init in main)
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_I3C_IBI_WORKQUEUE_STACK_SIZE=2048
CONFIG_STACK_SENTINEL=y
