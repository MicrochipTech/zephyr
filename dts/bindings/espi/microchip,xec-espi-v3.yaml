description: |
  Microchip XEC eSPI V3 controller.

  Unlike the V2 driver, the V3 driver does not implement the peripheral
  (logical) channel devices itself. Each peripheral is a separate Zephyr driver
  bound to its own child node. This driver retains ownership of the I/O BAR,
  Memory BAR and Serial IRQ registers, programming them from each okay child
  node's io-bars, mem-bars and sirqs properties, and notifies registered
  peripheral drivers when that hardware becomes usable or is held in reset.

compatible: "microchip,xec-espi-v3"

include: [espi-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    description: mmio register space
    required: true

  reg-names:
    required: true
    description: Name of each register space

  girqs:
    type: array
    required: true
    description: |
      Array of encoded interrupt information

  pcr-scr:
    type: int
    required: true
    description: |
      Encoded PCR sleep, clock required, reset register index and bit position.

  girq-wake:
    type: int
    required: true
    description: |
      Encoded PLL wake GIRQ and bit position for eSPI. This wake-only GIRQ must
      be enabled if the Host sends eSPI traffic when the SoC is in deep sleep.
      The wake GIRQ turns on the ring oscillator and and SoC eSPI hardware captures
      and examines the eSPI packet. If the HW can service the packet without SoC
      firmware intervention it does so and turns off the ring oscillator. If firmware
      is required the PLL is enabled and the respective eSPI interrupt to the SoC
      processor is asserted.

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  host-memmap-addr-high:
    type: int
    description: |
      Contains bits [47:32] of the Host address range where all memory mapped
      host (logical) devices are located in Host memory address space.

  sram-bar-addr-high:
    type: int
    description: |
      Contains Host address bits [47:32] where both SRAM BAR's are mapped
      to Host memory address space.
