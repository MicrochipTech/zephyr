description: |
    Microchip XEC I3C controller.

    The MEC SoCs integrate the Synopsys DesignWare DWC_mipi_i3c IP behind an
    XEC-specific wrapper, so this binding shares the i3c_dw.c driver with
    snps,designware-i3c. The wrapper adds a HOST_CFG port-select register, and
    routes the interrupt through the XEC Interrupt Aggregator (ECIA)

compatible: "microchip,xec-i3c"

include:
  - name: i3c-controller.yaml
  - name: pinctrl-device.yaml
  - name: microchip,dmec-ecia-girq.yaml

class: [i3c, i2c]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true
    description: |
      PCR clock specifier: <&pcr regidx bitpos MCHP_XEC_PCR_CLK_I3C>.
      regidx and bitpos locate this controller's bit in the PCR sleep-enable /
      clock-required / reset-enable registers. The clock ID selects the 192 MHz
      I3C domain reported by the XEC clock control driver, which requires a SoC
      that selects HAS_MCHP_MEC_I3C.

  port-sel:
    type: int
    default: 0
    description: |
      I3C port selection written to HOST_CFG[2:0]. Selects which SoC pad group
      the controller drives. Must agree with the pinctrl-0 pin group.

  bcr:
    type: int
    description: |
      Bus Characteristics Register. The device role field, bits [7:6], selects
      the boot role of the instance during driver initialization: 0 boots as
      target, 1 as controller. A dual-role instance resets in controller mode,
      so an instance used as a target on a bus with another controller must set
      a target BCR to avoid two controllers driving the bus. The value is also
      reported during dynamic address assignment; bits the hardware fixes keep
      their hardware value. When absent, the hardware reset mode is kept.

  static-address:
    type: int
    description: |
      Target static address, programmed at init when the instance boots as a
      target. Lets the controller assign the dynamic address with SETDASA
      during its bus initialization, before the application configures the
      target.

  tgt-pid:
    type: array
    description: |
      Target 48-bit Provisioned ID, programmed at init when the instance boots
      as a target.
      array[0]: PID[47:32].
      array[1]: PID[31:0].

  maximum-read:
    type: int
    description: |
      Target maximum read length (MRL) in bytes, programmed at init when the
      instance boots as a target.

  maximum-write:
    type: int
    description: |
      Target maximum write length (MWL) in bytes, programmed at init when the
      instance boots as a target.
